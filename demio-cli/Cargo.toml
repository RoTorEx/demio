[package]
name = "demio-cli"
version = "0.1.9"
edition = "2024"
rust-version = "1.85"
description = "One demo remote for project workflows, with stable channel IDs and narration cues"
license = "MIT"
repository = "https://github.com/RoTorEx/demio"
publish = false

[[bin]]
name = "demio"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
crossterm = "0.29"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
ctrlc = "3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

[lints.rust]
unsafe_code = "forbid"
