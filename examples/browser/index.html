<!doctype html><html lang="en"><meta charset="utf-8"><title>Demio · Browser example</title>
<style>html{scroll-behavior:smooth}body{font:20px system-ui;background:#f4f5f8;color:#223;margin:0}main{max-width:760px;margin:55px auto}section{padding:32px;margin:35px 0;background:white;border-radius:16px}input,textarea,select,button{font:inherit;padding:12px;border:1px solid #ccd;border-radius:8px}input,textarea{display:block;width:90%;margin:12px 0 24px}button{cursor:pointer;background:#6474ff;color:white}#role{position:sticky;top:15px;background:white}#status{font-weight:bold;padding:24px;background:#e6ebff;border-radius:12px}footer{height:280px}</style>
<main><h1>Request walkthrough</h1><label>Role <select id="role"><option>Requester</option><option>Approver</option></select></label>
<section id="form"><h2>Create a request</h2><label>Summary<input id="summary"></label><label>Justification<textarea id="reason"></textarea></label><button id="submit">Submit request</button></section>
<section><h2>Current status</h2><div id="status">Draft</div></section>
<section id="approval"><h2>Approval workspace</h2><p id="details">Submit a request to start.</p><button id="approve" disabled>Approve request</button></section><footer></footer></main>
<script>const status=document.querySelector('#status'),approve=document.querySelector('#approve');document.querySelector('#submit').onclick=()=>{if(!document.querySelector('#summary').value)return;status.textContent='Awaiting approval';document.querySelector('#details').textContent=document.querySelector('#summary').value+' — '+document.querySelector('#reason').value;approve.disabled=document.querySelector('#role').value!=='Approver'};document.querySelector('#role').onchange=()=>{approve.disabled=status.textContent!=='Awaiting approval'||document.querySelector('#role').value!=='Approver'};approve.onclick=()=>{status.textContent='Approved';approve.disabled=true};</script></html>
