[package]
name = "demio"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "One demo remote for project workflows, with stable channel IDs and narration cues"
license = "MIT"
repository = "https://github.com/RoTorEx/demio"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossterm = "0.29"
ctrlc = "3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
